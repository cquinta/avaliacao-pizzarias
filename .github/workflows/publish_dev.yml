name: Build and Push to Docker Hub

# Gatilho (trigger)
# Este workflow será executado a cada push para qualquer branch
on:
  push:
    branches:
      - '*'

jobs:
  build-and-push:
    # O tipo de máquina virtual para executar o job
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: apiimage
            context_path: ./api
          - image_name: dbimage
            context_path: ./db
          - image_name: frontendimage
            context_path: ./frontend

    steps:
      # 1. Faz o checkout do seu repositório no runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Faz o login no Docker Hub
      # Requer que os segredos DOCKERHUB_USERNAME e DOCKERHUB_TOKEN estejam configurados no seu repositório
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_INFNET_USERNAME }}
          password: ${{ secrets.DOCKERHUB_INFNET_TOKEN }}

      # 3. Extrai o nome da branch 
      # Isso garante que a tag do Docker seja válida (evita problemas com letras maiúsculas)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
            images: carlosquintanilha/${{ matrix.image_name }}
            tags: |
                type=ref,event=branch
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

    # 5. Constrói a imagem Docker e a envia para o Docker Hub
      # A tag da imagem será no formato: cquinta/moc-app:<nome-da-branch>
      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Opcional: Adiciona cache para acelerar builds futuros
          cache-from: type=registry,ref=carlosquintanilha/apiimage:buildcache
          cache-to: type=registry,ref=carlosquintanilha/apiimage:buildcache,mode=max
      
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Opcional: Adiciona cache para acelerar builds futuros
          cache-from: type=registry,ref=carlosquintanilha/frontendimage:buildcache
          cache-to: type=registry,ref=carlosquintanilha/frontendimabe:buildcache,mode=max

      - name: Build and push db
        uses: docker/build-push-action@v5
        with:
          context: ./db
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Opcional: Adiciona cache para acelerar builds futuros
          cache-from: type=registry,ref=carlosquintanilha/dbimabe:buildcache
          cache-to: type=registry,ref=carlosquintanilha/dbimabe:buildcache,mode=max