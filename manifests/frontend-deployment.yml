apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    layer: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      layer: frontend
  template:
    metadata:
      labels:
        layer: frontend
    spec:
      containers:
      - name: frontend
        image: carlosquintanilha/frontendimage:main
        ports:
        - containerPort: 8501
        
        env:
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: config-parameters
              key: api-url
        - name: UPDATED
          valueFrom: 
            configMapKeyRef:
              name: config-parameters
              key: updated

