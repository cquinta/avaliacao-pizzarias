apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: carlosquintanilha/apiimage
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_PASSWORD
          value: "M@sterkey123"
        - name: DB_HOST
          value: "db"


