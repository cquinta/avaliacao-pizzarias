apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: carlosquintanilha/apiimage
        ports:
        - containerPort: 8000
        env:
        - name: DB_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: secret-configurations
              key: password
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: config-parameters
              key: db-hostname  
        


